apiVersion: v1
kind: Service

metadata:
  name: supportmind-api
  namespace: supportmind
  labels:
    app.kubernetes.io/name: supportmind
    app.kubernetes.io/component: api

spec:
  type: {{ .Values.service.type }}

  selector:
    app: supportmind-api

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}