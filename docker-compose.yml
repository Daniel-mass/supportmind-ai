
services:
  # ---------------------------------------------------------
  # SupportMind API
  # FastAPI backend, including the Graph-RAG pipeline.
  # ---------------------------------------------------------
  supportmind-api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: supportmind-api

    ports:
      - "8000:8000"

    # Load shared application configuration from the project
    # root .env file. Service-specific values below override
    # matching environment variables from this file.
    env_file:
      - .env

    environment:
      # Ollama runs on the Windows host, outside Docker.
      # host.docker.internal lets the container reach it.
      OLLAMA_HOST: http://host.docker.internal:11434

      # Default LLM used by the SupportMind application.
      SUPPORTMIND_LLM_MODEL: qwen3:8b

      # Graph-RAG answer-generation model.
      # Keep this aligned with the locally verified model.
      SUPPORTMIND_GRAPH_RAG_MODEL: qwen3:8b

      # Persistent cache location for FastEmbed models.
      FASTEMBED_CACHE_DIR: /data/fastembed-cache

      # Phoenix tracing endpoints for application observability.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_BASE_URL: http://phoenix:6006

      # MLflow runs on the Windows host.
      # Used for experiment tracking and model evaluation.
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000

      # Qdrant vector database.
      # The existing Qdrant container is shared with this API.
      # Used by dense retrieval in the Graph-RAG pipeline.
      QDRANT_URL: http://sharebot-qdrant:6333
      QDRANT_HOST: sharebot-qdrant
      QDRANT_PORT: "6333"
      QDRANT_HTTPS: "false"

      # Neo4j graph database.
      # Used by graph retrieval and knowledge relationships.
      NEO4J_URI: bolt://neo4j-sentinel:7687

      # CSV datasets mounted read-only into the API container.
      # These paths must match the container's mounted directory.
      SUPPORTMIND_ISSUES_CSV: /data/rawsupportminddata/Help Desk Tickets/Help Desk Tickets/issues.csv
      SUPPORTMIND_CHANGE_HISTORY_CSV: /data/rawsupportminddata/Help Desk Tickets/Help Desk Tickets/issues_change_history.csv

    volumes:
      # Mount source datasets read-only to protect the originals.
      - ./rawsupportminddata:/data/rawsupportminddata:ro

      # Keep embedding model files cached between container recreations.
      - fastembed-cache:/data/fastembed-cache

    networks:
      - supportmind-net

    # Wait for Phoenix health before starting the API.
    depends_on:
      phoenix:
        condition: service_healthy

    restart: unless-stopped


  # ---------------------------------------------------------
  # Phoenix observability service
  # Receives and displays traces from SupportMind components.
  # ---------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:version-20.14.0

    container_name: supportmind-phoenix

    ports:
      - "6006:6006"
      - "4317:4317"

    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_LOG_LEVEL: info
      PHOENIX_GRPC_PORT: "4317"
      PHOENIX_HTTP_PORT: "6006"

    # Preserve Phoenix data across container recreation.
    volumes:
      - phoenix-data:/data

    networks:
      - supportmind-net

    # Report healthy only after Phoenix's HTTP health endpoint responds.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


# -----------------------------------------------------------
# Shared Docker network
# Allows the API to communicate with existing Qdrant and
# Neo4j containers, as well as Phoenix, using container names.
# This network must already exist.
# -----------------------------------------------------------
networks:
  supportmind-net:
    external: true


# -----------------------------------------------------------
# Persistent Docker volumes
# Prevent cached embeddings and Phoenix data from being lost
# when their containers are recreated.
# -----------------------------------------------------------
volumes:
  phoenix-data:
    driver: local

  fastembed-cache:
    driver: local